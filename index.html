<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linux Quiz App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="quiz-card" aria-live="polite">
      <header class="quiz-header">
        <h1>Linux MCQ Quiz</h1>
        <p id="progress" class="progress">Question 1 of 60</p>
      </header>

      <div id="quiz-body" class="quiz-body">
        <h2 id="question-text" class="question"></h2>
        <div id="options" class="options" role="list"></div>
        <p id="feedback" class="feedback"></p>
      </div>

      <div id="controls" class="controls">
        <button id="prev-btn" class="btn btn-secondary" type="button">Previous</button>
        <button id="next-btn" class="btn" type="button">Next</button>
      </div>
    </section>

    <section id="results" class="results hidden" aria-live="polite">
      <h2>Quiz Complete 🎉</h2>
      <p id="score-text"></p>
      <button id="restart-btn" class="btn" type="button">Restart Quiz</button>
      <div id="review" class="review"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
